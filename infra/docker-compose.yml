# SchoolSync — single-host production-style stack.   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
# For real scale: managed Postgres + PgBouncer, several `api` replicas behind a load balancer, one `worker`.
name: schoolsync

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB", "-c", "log_min_duration_statement=500"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"], interval: 5s, timeout: 3s, retries: 20 }

  # Connection pooling between the API and Postgres: many schools × small pools would otherwise exhaust connections.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${PG_USER:-postgres}
      DB_PASSWORD: ${PG_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 40
      AUTH_TYPE: scram-sha-256
      # the API sets statement_timeout etc. as startup options
      IGNORE_STARTUP_PARAMETERS: options,extra_float_digits
    depends_on: { postgres: { condition: service_healthy } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]

  api: &api
    build: { context: .., dockerfile: infra/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PG_HOST: pgbouncer
      PG_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RUN_WORKERS: "false"          # workers run in the dedicated `worker` service
      TRUST_PROXY: "true"
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    depends_on: [pgbouncer, redis]
    deploy: { replicas: 2 }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 3s, retries: 5 }

  # Push sweeper, usage metering, reminders, scheduled publishing. Run exactly one (jobs are advisory-locked anyway).
  worker:
    <<: *api
    deploy: { replicas: 1 }
    environment:
      NODE_ENV: production
      PG_HOST: pgbouncer
      PG_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      RUN_WORKERS: "true"
      STORAGE_DIR: /data/storage

  # One-shot: apply schema migrations to every school before the new API version takes traffic.
  migrate:
    <<: *api
    deploy: { replicas: 1 }
    restart: "no"
    command: ["node", "dist/cli/site-migrate.js"]
    environment:
      NODE_ENV: production
      PG_HOST: postgres            # migrations talk to Postgres directly (advisory locks need session mode)
      PG_PORT: 5432
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args: { NEXT_PUBLIC_BASE_DOMAIN: "${BASE_DOMAIN}" }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://api:4000          # server-side only; the browser never talks to the API directly
      BASE_DOMAIN: "${BASE_DOMAIN}"
      SITE_SELECT_MODE: redirect        # visitors without a school are sent to <code>.${BASE_DOMAIN}
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    environment: { BASE_DOMAIN: "${BASE_DOMAIN:?set BASE_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}" }
    depends_on: [api, web]

volumes: { pgdata: {}, redisdata: {}, storage: {}, caddy_data: {}, caddy_config: {} }
