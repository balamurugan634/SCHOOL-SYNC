packages:
  - apps/*
  - packages/*
# pnpm blocks dependency install scripts by default; these packages need them.
allowBuilds:
  '@embedded-postgres/linux-x64': true
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - framer-motion@14.5.0
  - lucide-react@1.61.0
  - motion-dom@14.5.0
  - motion@14.5.0
  - puppeteer-core@25.15.0
